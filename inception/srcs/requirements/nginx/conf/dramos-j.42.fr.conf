server {
    # Listen for HTTPS connections
    listen 443 ssl;
    listen [::]:443 ssl;

    # Server domain (set by environment)
    server_name $DOMAIN_NAME;

    # Enforce only TLSv1.2 for security
    ssl_protocols TLSv1.2;

    # Self-signed SSL certificate and key
    ssl_certificate /etc/ssl/nginx-selfsigned.pem;
    ssl_certificate_key /etc/ssl/nginx-selfsigned.key;

    # WordPress document root
    root /var/www/html;

    # Default index files
    index index.php index.html;

    # Main request handler: static files, then fallback to WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP requests to WordPress container (port 9000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
