# Automatically set the optimal number of workers
worker_processes auto;

# Store the master process PID here
pid /var/run/nginx.pid;

# Connection handling settings
events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

# Main HTTP server configuration
http {
    # File extension to MIME type mapping
    include /etc/nginx/mime.types;

    # Default MIME type if not detected
    default_type application/octet-stream;

    # Enable efficient file transfer
    sendfile on;

    # Keep connections open for 65 seconds
    keepalive_timeout 65;

    # Include all server/site configs
    include /etc/nginx/conf.d/*.conf;
}
