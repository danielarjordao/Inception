services:
  nginx:
    build:
      context: requirements/nginx/.
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
        USER: ${MYSQL_USER}
    image: nginx
    container_name: nginx
    restart: on-failure
    env_file:
      - .env
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  wordpress:
    build: requirements/wordpress/.
    image: wordpress
    container_name: wordpress
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_pass
      - admin_pass_wp
      - user_pass_wp
    expose:
      - "9000"
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  mariadb:
    build: requirements/mariadb/.
    image: mariadb
    container_name: mariadb
    restart: on-failure
    env_file:
      - .env
    secrets:
      - db_pass
    expose:
      - "3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception

secrets:
  db_pass:
    file: ../secrets/pass_mariadb.txt
  admin_pass_wp:
    file: ../secrets/admin_pass_wp.txt
  user_pass_wp:
    file: ../secrets/user_pass_wp.txt

networks:
  inception:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dramos-j/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dramos-j/data/mariadb
