server {
    # Listen on port 443 for HTTPS connections
    listen 443 ssl;
    listen [::]:443 ssl;

    # Domain name for this server
    server_name $DOMAIN_NAME;

    # Only allow TLSv1.2 for security
    ssl_protocols TLSv1.2;

    # SSL certificate files (self-signed)
    ssl_certificate /etc/ssl/nginx-selfsigned.pem;
    ssl_certificate_key /etc/ssl/nginx-selfsigned.key;

    # Directory where WordPress files are located
    root /var/www/html;

    # Try these files in order when accessing a directory
    index index.php index.html;

    # Handle all requests
    location / {
        # Try to serve file directly, then directory, then pass to WordPress
        try_files $uri $uri/ /index.php?$args;
    }

    # Process PHP files through WordPress container
    location ~ \.php$ {
        include fastcgi_params;
        # Forward PHP requests to WordPress container on port 9000
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        # Tell PHP-FPM which file to execute
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
