[www]
# Run PHP-FPM as www-data user and group
user = www-data
group = www-data
# Listen on all interfaces, port 9000 (for FastCGI)
listen = 0.0.0.0:9000
# Dynamic process management
pm = dynamic
pm.max_children = 5      ; Max PHP-FPM processes
pm.start_servers = 3     ; Start with 3 processes
pm.min_spare_servers = 1 ; Minimum spare processes
pm.max_spare_servers = 3 ; Maximum spare processes
pm.max_requests = 500    ; Restart worker after 500 requests

