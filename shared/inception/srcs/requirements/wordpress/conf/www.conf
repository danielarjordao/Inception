[www]

# Run PHP-FPM as www-data user for security
user = www-data
group = www-data

# Listen on all network interfaces on port 9000 (allows Nginx to connect)
listen = 0.0.0.0:9000

# Process manager type: dynamic (creates processes as needed)
pm = dynamic

# Maximum child processes that can exist at the same time
pm.max_children = 5

# Number of child processes created on startup
pm.start_servers = 3

# Minimum number of idle processes waiting for requests
pm.min_spare_servers = 1

# Maximum number of idle processes waiting for requests
pm.max_spare_servers = 3

# Maximum requests each child process handles before respawning (prevents memory leaks)
pm.max_requests = 500
